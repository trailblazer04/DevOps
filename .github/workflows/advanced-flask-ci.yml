name: Advanced CI Pipeline

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'Projects/cicd-github-actions/advanced-cicd-pipeline-flask-app/**'
      - '.github/workflows/advanced-flask-ci.yml'

jobs:
  test-lint-secure:
    name: Test & Inspect
    runs-on: ubuntu-latest
    
    # Monorepo Magic: Make all 'run' commands default to this directory
    defaults:
      run:
        working-directory: Projects/cicd-github-actions/advanced-cicd-pipeline-flask-app

    # The Matrix: Run this job 3 times in parallel
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies using uv
        run: |
          python -m pip install uv
          uv pip install --system -r requirements.txt

      - name: Lint with flake8
        run: |
          # Stop the build if there are critical Python syntax errors
          flake8 app --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats formatting errors as warnings so it doesn't fail the pipeline
          flake8 app --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        continue-on-error: true

      - name: Security scan (Bandit & Safety)
        run: |
          bandit -r app -f custom || true
          safety check || true
        continue-on-error: true

      - name: Run unit tests with Pytest
        run: |
          pytest tests/ -v